<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>SRCH — New-Tab recherche</title>
    <meta name="description" content="Moteur de recherche libre. Sans pub, sans tracking. Partageable par URL." />
    <meta property="og:title" content="SRCH" />
    <meta property="og:description" content="Le web, sans filtre." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="icon" type="image/x-icon" href="images/search.png" />
    <link rel="stylesheet" href="styles.css">
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Serif+Display:ital@0;1&display=swap"
        rel="stylesheet" />
    <style>
        :root {
            --bg: linear-gradient(135deg, #888a96 0%, #71a5cf 100%);
            --glass: rgba(255,255,255,0.14);
            --glass-border: rgba(255,255,255,0.25);
            --text: #ffffff;
            --text-sub: rgba(255,255,255,0.75);
            --accent: #ffffff;
            --radius: 18px;
            --sidebar-bg: rgba(255,255,255,0.97);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: var(--text);
            transition: background 0.6s ease;
            overflow-x: hidden;
        }

        /* MENU BURGER */
        .menu-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 17px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1001;
            transition: all 0.3s ease;
        }

        .menu-toggle:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .menu-toggle svg {
            width: 24px;
            height: 24px;
            stroke: white;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* OVERLAY */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(4px);
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        .overlay.active { opacity: 1; visibility: visible; }

        /* SIDEBAR */
        .sidebar {
            position: fixed;
            margin: 10px;
            margin-top: 20px;
            top: 0;
            left: -340px;
            width: 320px;
            height: 95vh;
            background: var(--sidebar-bg);
            backdrop-filter: blur(20px);
            box-shadow: 4px 0 30px rgba(0, 0, 0, 0.15);
            z-index: 1000;
            transition: left 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            border-radius: 22px;
        }

        .sidebar.active { left: 0; }

        .sidebar-header {
            padding: 28px 24px 22px;
            color: rgb(197, 190, 190);
            text-align: center;
            border-bottom: 1px solid #f0f0f0;
        }

        .sidebar-title { font-size: 20px; font-weight: 500; }

        .sidebar-body {
            padding: 20px;
            flex: 1;
            color: #222;
        }

        .sidebar-section {
            margin-bottom: 28px;
        }

        .sidebar-section-title {
            font-size: 11px;
            font-weight: 600;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
        }

        .sidebar-btn {
            width: 100%;
            padding: 13px 16px;
            background: #f5f5f5;
            border: 1px solid #e8e8e8;
            border-radius: 32px;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #333;
            cursor: pointer;
            transition: all 0.2s;
        }

        .sidebar-btn:hover { background: #eaeaea; }

        /* MAIN LAYOUT */
        .srp-layout {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }

        /* HEADER */
        #srp-hd {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 24px;
            z-index: 100;
        }

        #srp-logo {
            font-family: 'DM Serif Display', serif;
            font-weight: 400;
            font-size: 28px;
            letter-spacing: -1px;
            cursor: pointer;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        #srp-sw {
            width: 100%;
            position: relative;
        }

        .sbox {
            width: 100%;
            position: relative;
        }

        .sbox-input {
            width: 100%;
            padding: 17px 24px 17px 24px;
            font-size: 16px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.93);
            color: #333;
            outline: none;
            transition: all 0.3s ease;
            font-family: 'DM Sans', sans-serif;
        }

        .sbox-input:hover { 
            background: rgba(211, 211, 211, 0.95);
            border: 1px solid rgba(255, 255, 255, 1);
        }

        .sbox-input:focus {
            background: white;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
            transform: scale(1.01);
        }

        .sbox-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: rgba(0, 0, 0, 0.1);
            color: #333;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-weight: 700;
        }

        .sbox-btn:hover {
            background: rgba(0, 0, 0, 0.2);
            transform: translateY(-50%) scale(1.1);
        }

        .sbox-btn svg {
            width: 15px;
            height: 15px
        }

        /* FILTER TABS */
        #fbar {
            display: inline-flex;
            gap: 8px;
            margin-bottom: 24px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 8px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .ft {
            padding: 10px 16px;
            font-family: 'DM Sans', sans-serif;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.5px;
            color: rgba(255, 255, 255, 0.8);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            border-radius: 50px;
            border: none;
            background: transparent;
            margin: 0;
        }

        .ft:hover {
            color: white;
            background: rgba(255, 255, 255, 0.15);
        }

        .ft.active {
            background: rgba(255, 255, 255, 0.25);
            color: white;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .ft svg {
            width: 12px;
            height: 12px
        }

        /* RESULTS CONTAINER */
        #srp-body {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #rc {
            flex: 1;
            min-width: 0;
        }

        #meta {
            font-family: 'DM Sans', sans-serif;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 16px;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* SEARCH RESULTS STYLING */
        .ri {
            padding: 16px;
            animation: slideUp 0.3s ease both;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 18px;
            margin-bottom: 12px;
            transition: all 0.2s;
            color: #333;
        }

        .ri:hover {
            background: white;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
            transform: translateY(-2px);
        }

        .ri-top {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .ri-fav {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            font-weight: 700;
            color: #999;
            flex-shrink: 0;
            overflow: hidden;
        }

        .ri-fav img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%
        }

        .ri-crumb {
            font-family: 'DM Sans', sans-serif;
            font-size: 11px;
            color: #999;
            letter-spacing: 0.3px;
        }

        .ri-crumb span {
            color: #bbb;
        }

        .ri-title {
            font-size: 16px;
            font-weight: 600;
            color: #0066cc;
            display: block;
            margin-bottom: 6px;
            line-height: 1.4;
            letter-spacing: -0.3px;
            transition: all 0.2s;
            cursor: pointer;
        }

        .ri-title:hover {
            text-decoration: underline;
            color: #0052a3;
        }

        .ri-desc {
            font-size: 13px;
            color: #666;
            line-height: 1.6;
            font-weight: 400;
        }

        .ri-desc b {
            color: #333;
            font-weight: 600;
        }

        .ri-eng {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-family: 'DM Sans', sans-serif;
            font-size: 10px;
            letter-spacing: 0.4px;
            color: #999;
            margin-top: 8px;
        }

        .ri-eng-tag {
            background: #f5f5f5;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 9px;
        }

        /* IMAGES */
        #ig {
            display: none;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 8px;
        }

        .ic {
            border-radius: 14px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.95);
            aspect-ratio: 4/3;
            cursor: pointer;
            position: relative;
            transition: all 0.25s;
        }

        .ic:hover {
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            transform: translateY(-4px);
        }

        .ic-ov {
            position: absolute;
            inset: 0;
            background: linear-gradient(transparent 50%, rgba(0, 0, 0, .85));
            opacity: 0;
            transition: opacity .2s;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 10px;
        }

        .ic:hover .ic-ov {
            opacity: 1
        }

        .ic-src {
            font-family: 'DM Sans', sans-serif;
            font-size: 10px;
            color: rgba(255, 255, 255, .7);
            letter-spacing: 0.3px;
        }

        .ic-title {
            font-size: 11px;
            color: #fff;
            font-weight: 500;
            line-height: 1.3;
            margin-top: 2px;
        }

        /* NEWS */
        .ni {
            display: flex;
            gap: 14px;
            padding: 14px;
            animation: slideUp 0.3s ease both;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            margin-bottom: 12px;
            transition: all 0.2s;
            color: #333;
        }

        .ni:hover {
            background: white;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            transform: translateY(-2px);
        }

        .ni-thumb {
            width: 80px;
            height: 60px;
            border-radius: 12px;
            background: #f0f0f0;
            flex-shrink: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .ni-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .ni-src {
            font-family: 'DM Sans', sans-serif;
            font-size: 10px;
            color: #999;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .ni-title {
            font-size: 13px;
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
            cursor: pointer;
            line-height: 1.3;
        }

        .ni-title:hover {
            color: #0066cc;
        }

        .ni-snip {
            font-size: 12px;
            color: #666;
            line-height: 1.5;
        }

        /* VIDEOS */
        .vi {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
            animation: slideUp 0.3s ease both;
            background: rgba(255, 255, 255, 0.95);
            padding: 12px;
            border-radius: 16px;
            transition: all 0.2s;
            color: #333;
        }

        .vi:hover {
            background: white;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            transform: translateY(-2px);
        }

        .vi-thumb {
            width: 140px;
            height: 80px;
            border-radius: 12px;
            overflow: hidden;
            flex-shrink: 0;
            background: #f0f0f0;
            cursor: pointer;
            position: relative;
        }

        .vi-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .vi-play {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, .4);
            color: #fff;
            font-size: 24px;
            opacity: 0;
            transition: opacity .15s;
        }

        .vi-thumb:hover .vi-play {
            opacity: 1;
        }

        .vi-title {
            font-size: 13px;
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
            cursor: pointer;
            line-height: 1.3;
        }

        .vi-title:hover {
            color: #0066cc;
        }

        .vi-meta {
            font-family: 'DM Sans', sans-serif;
            font-size: 10px;
            color: #999;
            letter-spacing: 0.3px;
        }

        /* LOADING STATE */
        #loading {
            display: none;
            flex-direction: column;
            gap: 12px;
        }

        .sk-item {
            padding: 14px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .sk {
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.1) 25%, rgba(255, 255, 255, 0.2) 50%, rgba(255, 255, 255, 0.1) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 6px;
        }

        .sk-a { height: 10px; }
        .sk-b { height: 14px; width: 80%; }
        .sk-c { height: 10px; width: 100%; }
        .sk-d { height: 10px; width: 60%; }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* WARMUP MESSAGE */
        #warmup {
            display: none;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            margin-bottom: 12px;
            background: rgba(255, 194, 110, 0.15);
            border: 1px solid rgba(255, 194, 110, 0.3);
            border-radius: 12px;
            font-family: 'DM Sans', sans-serif;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.9);
            letter-spacing: 0.3px;
            font-weight: 500;
        }

        .wu-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.8);
            display: inline-block;
            margin: 0 2px;
            animation: wp 1.2s ease-in-out infinite;
        }

        .wu-dot:nth-child(2) { animation-delay: .2s; }
        .wu-dot:nth-child(3) { animation-delay: .4s; }

        @keyframes wp {
            0%, 100% { opacity: .2; }
            50% { opacity: 1; }
        }

        /* NO RESULTS */
        #nores {
            display: none;
            padding: 3rem 0;
            text-align: center;
        }

        .no-t {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .no-s {
            font-family: 'DM Serif Display', serif;
            font-style: italic;
            font-size: 15px;
            color: rgba(255, 255, 255, 0.7);
        }

        /* ERROR MESSAGE */
        #errmsg {
            display: none;
            padding: 12px 16px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 100, 100, 0.3);
            border-radius: 12px;
            background: rgba(255, 100, 100, 0.1);
            font-family: 'DM Sans', sans-serif;
            font-size: 12px;
            color: rgba(255, 200, 200, 0.9);
            letter-spacing: 0.3px;
        }

        /* PAGINATION */
        #pg {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 2rem 0 3rem;
            flex-wrap: wrap;
        }

        .pb {
            min-width: 40px;
            height: 40px;
            padding: 0 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            background: transparent;
            color: white;
            font-family: 'DM Sans', sans-serif;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.3px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .pb:hover {
            border-color: rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .pb.active {
            background: rgba(255, 255, 255, 0.25);
            color: white;
            border-color: rgba(255, 255, 255, 0.4);
            font-weight: 600;
        }

        .pb:disabled {
            opacity: 0.25;
            cursor: default;
            pointer-events: none;
        }

        .pb svg {
            width: 12px;
            height: 12px;
        }

        /* FOOTER */
        #srp-ft {
            text-align: center;
            padding: 2rem;
            color: rgba(255, 255, 255, 0.7);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 2rem;
        }

        .ft-right {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .ft-link {
            font-family: 'DM Sans', sans-serif;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
            letter-spacing: 0.3px;
            text-decoration: underline;
            text-underline-offset: 3px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .ft-link:hover {
            color: white;
        }

        /* SIDEBAR SUGGESTIONS */
        #sb {
            display: none;
        }

        /* SHARE TOAST */
        #share-toast {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            font-family: 'DM Sans', sans-serif;
            font-size: 12px;
            letter-spacing: 0.3px;
            padding: 10px 18px;
            border-radius: 50px;
            opacity: 0;
            transition: all 0.3s;
            pointer-events: none;
            z-index: 999;
            font-weight: 500;
        }

        #share-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* SUGGESTIONS */
        .sugg {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 18px;
            overflow: hidden;
            z-index: 300;
            display: none;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
        }

        .sugg.open {
            display: block;
        }

        .sugg-item {
            padding: 12px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            font-size: 14px;
            color: #666;
            border-bottom: 1px solid #f0f0f0;
            transition: all 0.15s;
            font-family: 'DM Sans', sans-serif;
            letter-spacing: 0.2px;
        }

        .sugg-item:last-child {
            border-bottom: none;
        }

        .sugg-item:hover,
        .sugg-item.sel {
            background: #f8f8f8;
            color: #333;
            padding-left: 22px;
        }

        .sugg-icon {
            color: #ccc;
            flex-shrink: 0;
        }

        /* RESULTS CONTAINERS */
        #srp {
            display: none;
        }

        #wr {
            display: none;
        }

        #ig {
            display: none;
        }

        #nr {
            display: none;
        }

        #vr {
            display: none;
        }

        /* ANIMATIONS */
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* RESPONSIVE */
        @media (max-width: 820px) {
            #fbar {
                flex-wrap: wrap;
                justify-content: center;
            }

            .ri {
                padding: 12px;
            }

            .vi-thumb {
                width: 100px;
                height: 60px;
            }

            .ni {
                flex-direction: column;
            }

            .ni-thumb {
                width: 100%;
                height: 160px;
            }

            #ig {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            }
        }
    </style>
</head>

<body>

    <!-- Menu Toggle -->
    <div class="menu-toggle" id="menuToggle">
        <svg viewBox="0 0 24 24">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
    </div>

    <!-- Overlay -->
    <div class="overlay" id="overlay"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar" aria-label="Paramètres">
        <div class="sidebar-header">
            <span class="sidebar-title">Paramètres</span>
        </div>
        <div class="sidebar-body">
            <div class="sidebar-section">
                <div class="sidebar-section-title">Recherche</div>
                <div class="setting-row">
                    <span>Nouvelle page de résultats</span>
                </div>

                    <span>Voir les détails techniques</span>

            </div>
            <div class="sidebar-section">
                <div class="sidebar-section-title">Plus</div>
                <a class="sidebar-btn" href="https://github.com/Devlaubin/New-Tab" target="_blank">Code source</a>

    </aside>

    <!-- Main Layout -->
    <div class="srp-layout">
        <!-- SRP -->
        <div id="srp">
            <header id="srp-hd">
                <div id="srp-logo" onclick="goHome()" role="button" tabindex="0" aria-label="Retour à l'accueil"
                    title="Retour à l'accueil">SRCH</div>
                <div id="srp-sw">
                    <div class="sbox">
                        <input class="sbox-input" id="sq" type="text" placeholder="Rechercher..." autocomplete="off"
                            spellcheck="false" aria-label="Champ de recherche" />
                        <button class="sbox-btn" onclick="go('sq')" aria-label="Lancer la recherche"
                            title="Lancer la recherche">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                                stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="11" cy="11" r="8" />
                                <line x1="21" y1="21" x2="16.65" y2="16.65" />
                            </svg>

                    </div>
                </div>
            </header>

            <div id="fbar" role="tablist" aria-label="Filtres de recherche">
                <div class="ft active" data-tab="general" onclick="tab('general')" role="tab" aria-selected="true"
                    tabindex="0" title="Résultats web">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8" />
                        <line x1="21" y1="21" x2="16.65" y2="16.65" />
                    </svg>WEB
                </div>
                <div class="ft" data-tab="images" onclick="tab('images')" role="tab" aria-selected="false" tabindex="-1"
                    title="Résultats images">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" />
                        <circle cx="8.5" cy="8.5" r="1.5" />
                        <polyline points="21 15 16 10 5 21" />
                    </svg>IMAGES
                </div>
                <div class="ft" data-tab="news" onclick="tab('news')" role="tab" aria-selected="false" tabindex="-1"
                    title="Résultats actualités">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path
                            d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 0-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2" />
                        <path d="M18 14h-8M15 18h-5M10 6h8v4h-8V6Z" />

                </div>

            <div id="srp-body">
                <div id="rc" role="main" aria-label="Résultats de recherche">
                    <div id="meta"></div>

                        DÉMARRAGE EN COURS — PATIENTER ~30s
                    </div>

                        <div class="sk-item">

                        </div>
                        <div class="sk-item">
                            <div class="sk sk-a"></div>

                            <div class="sk sk-c"></div>
                        </div>

                            <div class="sk sk-a"></div>

                        title="Code source sur GitHub">OPEN SOURCE</a>

                </div>

    </div>

    <div id="share-toast">LIEN COPIÉ !</div>

    <script>
    const API = '/api';
    let Q = '', TAB = 'general', PAGE = 1;
    let sgTimer = null, sgIdx = -1, warmupShown = false;

        const $ = id => document.getElementById(id);
        const E = {
            srp: $('srp'),
            sq: $('sq'),
            ssugg: $('ssugg'),
            meta: $('meta'), warmup: $('warmup'),
            loading: $('loading'), wr: $('wr'),
            ig: $('ig'), nr: $('nr'), vr: $('vr'),
            nores: $('nores'), errmsg: $('errmsg'),
            pg: $('pg'), sbc: $('sbc'), toast: $('share-toast'),
            menuToggle: $('menuToggle'),
            overlay: $('overlay'),
            sidebar: $('sidebar')
        };

        // Menu Toggle
        E.menuToggle.addEventListener('click', () => {
            E.sidebar.classList.toggle('active');
            E.overlay.classList.toggle('active');
        });

        E.overlay.addEventListener('click', () => {
            E.sidebar.classList.remove('active');
            E.overlay.classList.remove('active');
        });

        // ── URL STATE ── ?q=query&tab=general&p=1
        function readURL() {
            const p = new URLSearchParams(location.search);
            const q = p.get('q') || p.get('Q') || '';
            const t = p.get('tab') || 'general';
            const pg = parseInt(p.get('p') || '1', 10) || 1;
            if (!q) { window.location.href = 'index.html'; return; }
            Q = q; TAB = t; PAGE = pg; showSRP(); doSearch();
        }
    function pushURL() {
      const p = new URLSearchParams();
      p.set('q', Q);
      if (TAB !== 'general') p.set('tab', TAB);
      if (PAGE > 1) p.set('p', PAGE);
      history.pushState({}, '', `?${p.toString()}`);
    }
        window.addEventListener('popstate', () => {
            const p = new URLSearchParams(location.search);
            const q = p.get('q') || p.get('Q') || '';
            if (q) { Q = q; TAB = p.get('tab') || 'general'; PAGE = parseInt(p.get('p') || '1', 10) || 1; showSRP(); doSearch(); }
            else { window.location.href = 'index.html'; }
        });

        // ── INIT ──
        E.sq.addEventListener('keydown', e => onKey(e));
        E.sq.addEventListener('input', () => suggest(E.sq, E.ssugg));
        document.addEventListener('click', e => { if (!e.target.closest('.sbox')) closeSg(); });
        readURL();

        function onKey(e) {
            const box = E.ssugg, inp = E.sq;
            const items = box.querySelectorAll('.sugg-item');
            if (e.key === 'ArrowDown') { e.preventDefault(); sgIdx = Math.min(sgIdx + 1, items.length - 1); hlSg(items); }
            else if (e.key === 'ArrowUp') { e.preventDefault(); sgIdx = Math.max(sgIdx - 1, -1); hlSg(items); }
            else if (e.key === 'Enter') {
                if (sgIdx >= 0 && items[sgIdx]) { inp.value = items[sgIdx].dataset.q; closeSg(); sgIdx = -1; }
                go('sq');
            } else if (e.key === 'Escape') closeSg();
        }
        function hlSg(items) { items.forEach((it, i) => it.classList.toggle('sel', i === sgIdx)); }
        function closeSg() { if (E.ssugg) E.ssugg.classList.remove('open'); }

    // ── SUGGESTIONS ──
    async function suggest(inp, box) {
      clearTimeout(sgTimer);
      const q = inp.value.trim();
      if (q.length < 2) { box.classList.remove('open'); return; }
      sgTimer = setTimeout(async () => {
        try {
          const res = await fetch(`${API}/autocompleter?q=${encodeURIComponent(q)}&format=json`);
          const data = await res.json();
          const sugs = Array.isArray(data[1]) ? data[1] : (Array.isArray(data) ? data.filter(s => typeof s === 'string') : []);
          if (!sugs.length) { box.classList.remove('open'); return; }
          box.innerHTML = sugs.slice(0, 7).map(s => `
        <div class="sugg-item" data-q="${esc(s)}" onclick="pickSg('${esc(s)}',this)">
          <svg class="sugg-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          ${s}
        </div>`).join('');
          box.classList.add('open'); sgIdx = -1;
        } catch { }
      }, 220);
    }
    function pickSg(val, el) {
            E.sq.value = val;
            closeSg(); go('sq');
    }

    // ── NAV ──
        function quick(q) { E.sq.value = q; go('sq'); }
        function goHome() {
            window.location.href = 'index.html';
        }
    function go(id) {
      const q = document.getElementById(id).value.trim();
      if (!q) return;
      closeSg(); Q = q; TAB = 'general'; PAGE = 1;
      showSRP(); pushURL(); doSearch();
    }
        function showSRP() {
            E.srp.style.display = 'block';
            E.sq.value = Q;
            document.querySelectorAll('.ft').forEach(t => t.classList.toggle('active', t.dataset.tab === TAB));
        }
    function tab(t) {
      TAB = t; PAGE = 1;
      document.querySelectorAll('.ft').forEach(f => f.classList.toggle('active', f.dataset.tab === t));
      pushURL(); clearUI(); doSearch();
    }

    // ── CLEAR ──
    function clearUI() {
      if (E.meta) E.meta.textContent = '';
      [E.wr, E.ig, E.nr, E.vr].forEach(el => { if(el) { el.innerHTML = ''; el.style.display = 'none'; } });
      if(E.nores) E.nores.style.display = 'none';
      if(E.errmsg) E.errmsg.style.display = 'none';
      if(E.pg) E.pg.innerHTML = '';
      if(E.sbc) E.sbc.innerHTML = '';
      if(E.warmup) E.warmup.style.display = 'none';
    }

    // ── SEARCH ──
    async function doSearch() {
      clearUI();
      if (E.loading) E.loading.style.display = 'flex';
      if (!warmupShown) { warmupShown = true; if(E.warmup) E.warmup.style.display = 'flex'; }
      const t0 = performance.now();
      const params = new URLSearchParams({ q: Q, format: 'json', language: 'fr-FR', categories: TAB, pageno: PAGE });
      try {
        const res = await fetch(`${API}/search?${params}`);
        if (!res.ok) throw new Error(`Erreur ${res.status} — le serveur est peut-être en cold start (~30s), réessaie.`);
        const data = await res.json();
        const elapsed = ((performance.now() - t0) / 1000).toFixed(2);
        if (E.loading) E.loading.style.display = 'none';
        if (E.warmup) E.warmup.style.display = 'none';
        const items = data.results || [];
        const total = data.number_of_results || 0;
        if (E.meta) E.meta.innerHTML = `<span>${total ? '~' + Number(total).toLocaleString('fr-FR') + ' résultats' : items.length + ' résultats'}</span><span class="sep">·</span><span>${elapsed}s</span><span class="sep">·</span><span>Google + Bing + DDG</span>`;
        if (!items.length) { if(E.nores) E.nores.style.display = 'block'; return; }
        if (TAB === 'general') renderWeb(items, data);
        else if (TAB === 'images') renderImages(items);
        else if (TAB === 'news') renderNews(items);
        else renderVideos(items);
        renderPg(items.length);
      } catch (err) {
        if (E.loading) E.loading.style.display = 'none';
        if (E.errmsg) { E.errmsg.innerHTML = `⚠ ${err.message}`; E.errmsg.style.display = 'block'; }
      }
    }

    // ── WEB ──
    function renderWeb(items, data) {
      if (!E.wr) return;
      E.wr.innerHTML = items.map((r, i) => {
        const dom = xDom(r.url);
        const engs = (r.engines || []).slice(0, 3).map(e => `<span class="ri-eng-tag">${e}</span>`).join('');
        return `<div class="ri" style="animation-delay:${i * .04}s">
      <div class="ri-top">
        <div class="ri-fav"><img src="https://www.google.com/s2/favicons?sz=32&domain=${dom}" loading="lazy" onerror="this.parentElement.textContent='${(dom[0] || '?').toUpperCase()}'"/></div>
        <span class="ri-crumb"><span>${dom}</span>${r.publishedDate ? ` · ${r.publishedDate.slice(0, 10)}` : ''}</span>
      </div>
      <a class="ri-title" href="${r.url}" target="_blank">${r.title}</a>
      <div class="ri-desc">${hlQ(r.content || '', Q)}</div>
      ${engs ? `<div class="ri-eng">${engs}</div>` : ''}
    </div>`;
      }).join('');
      E.wr.style.display = 'block';
    }

    // ── IMAGES ──
    function renderImages(items) {
      if (!E.ig) return;
      const f = items.filter(r => r.img_src || r.thumbnail_src);
      if (!f.length) { if(E.nores) E.nores.style.display = 'block'; return; }
      E.ig.innerHTML = f.map(r => `
    <div class="ic" onclick="window.open('${esc(r.url)}','_blank')">
      <img src="${r.img_src || r.thumbnail_src}" loading="lazy" onerror="this.style.display='none'"/>
      <div class="ic-ov">
        <div class="ic-src">${r.source || xDom(r.url)}</div>
        <div class="ic-title">${(r.title || '').slice(0, 50)}</div>
      </div>
    </div>`).join('');
      E.ig.style.display = 'grid';
    }

    // ── NEWS ──
    function renderNews(items) {
      if (!E.nr) return;
      E.nr.innerHTML = items.map((r, i) => `
    <div class="ni" style="animation-delay:${i * .04}s">
      <div class="ni-thumb">${r.img_src ? `<img src="${r.img_src}" loading="lazy" onerror="this.parentElement.textContent='📰'"/>` : '📰'}</div>
      <div>
        <div class="ni-src">${(r.source || xDom(r.url)).toUpperCase()}${r.publishedDate ? ' · ' + r.publishedDate.slice(0, 10) : ''}</div>
        <div class="ni-title" onclick="window.open('${esc(r.url)}','_blank')">${r.title}</div>
        <div class="ni-snip">${r.content || ''}</div>
      </div>
    </div>`).join('');
      E.nr.style.display = 'block';
    }

    // ── VIDEOS ──
    function renderVideos(items) {
      if (!E.vr) return;
      E.vr.innerHTML = items.map((r, i) => `
    <div class="vi" style="animation-delay:${i * .04}s">
      <div class="vi-thumb" onclick="window.open('${esc(r.url)}','_blank')">
        ${r.thumbnail ? `<img src="${r.thumbnail}" loading="lazy"/>` : ''}
        <div class="vi-play">▶</div>
      </div>
      <div>
        <div class="vi-title" onclick="window.open('${esc(r.url)}','_blank')">${r.title}</div>
        <div class="vi-meta">${[r.source, r.publishedDate?.slice(0, 10)].filter(Boolean).join(' · ')}</div>
        ${r.content ? `<div class="vi-meta" style="margin-top:4px;color:rgba(255,255,255,0.6)">${r.content.slice(0, 120)}</div>` : ''}
      </div>
    </div>`).join('');
      E.vr.style.display = 'block';
    }

    // ── PAGINATION ──
    function renderPg(count) {
      if (PAGE === 1 && count < 10) return;
      let html = `<button class="pb" onclick="gp(${PAGE - 1})" ${PAGE === 1 ? 'disabled' : ''}>
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>PREV
  </button>`;
      const lo = Math.max(1, PAGE - 2), hi = Math.min(10, PAGE + 2);
      for (let p = lo; p <= hi; p++)html += `<button class="pb ${p === PAGE ? 'active' : ''}" onclick="gp(${p})">${p}</button>`;
      if (count >= 10) html += `<button class="pb" onclick="gp(${PAGE + 1})">NEXT<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></button>`;
      if (E.pg) E.pg.innerHTML = html;
    }
    function gp(p) { if (p < 1 || p > 10) return; PAGE = p; pushURL(); clearUI(); doSearch(); document.querySelector('#srp-hd').scrollIntoView({ behavior: 'smooth' }); }

    // ── UTILS ──
    function xDom(url) { try { return new URL(url).hostname.replace('www.', '') } catch { return url } }
    function esc(s) { return (s || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;') }
    function hlQ(text, q) {
      if (!text || !q) return text;
      q.trim().split(/\s+/).filter(w => w.length > 2).forEach(w => {
        try { text = text.replace(new RegExp(`(${w})`, 'gi'), '<b>$1</b>') } catch { }
      });
      return text;
    }
    </script>
