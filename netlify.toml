[[redirects]]
  from = "/api/*"
  to = "https://moteur-server-xng.onrender.com/:splat"
  status = 200
  force = true
  headers = {Access-Control-Allow-Origin = "*", Access-Control-Allow-Methods = "GET, POST, OPTIONS", Access-Control-Allow-Headers = "*"}

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

